<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180a2b"/>
      <stop offset="50%" stop-color="#2c1150"/>
      <stop offset="100%" stop-color="#120620"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#c084fc" flood-opacity="0.9"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.8"/>
  
  <!-- Ninja Mask / Secret Head Emblem -->
  <g fill="#c084fc" filter="url(#purpleGlow)">
    <!-- Hood / Head Shape -->
    <path d="M32 10 C20 10 14 18 14 28 C14 36 18 43 22 47 L23 54 C23 55 24 56 25 56 L39 56 C40 56 41 55 41 54 L42 47 C46 43 50 36 50 28 C50 18 44 10 32 10 Z"/>
    
    <!-- Ninja Headband Knot / Fold -->
    <path d="M15 22 L49 22 L48 26 L16 26 Z" fill="#e9d5ff" opacity="0.95"/>
    
    <!-- Eyes Visor Slot (Dark) -->
    <path d="M19 28 C19 27 20 26 21 26 L43 26 C44 26 45 27 45 28 L45 35 C45 36 44 37 43 37 L21 37 C20 37 19 36 19 35 Z" fill="#0f0717"/>
    
    <!-- Ninja Eyes (Glowing Cyan / White) -->
    <path d="M22 30 C22 29 23 28.5 24 29 L28 32 C28.5 32.5 28 33.5 27 33.5 L23 33 C22.5 33 22 32 22 30 Z" fill="#38bdf8"/>
    <path d="M42 30 C42 29 41 28.5 40 29 L36 32 C35.5 32.5 36 33.5 37 33.5 L41 33 C41.5 33 42 32 42 30 Z" fill="#38bdf8"/>
    <circle cx="25.5" cy="31" r="1" fill="#ffffff"/>
    <circle cx="38.5" cy="31" r="1" fill="#ffffff"/>
    
    <!-- Lower Mask Fabric Line -->
    <path d="M22 43 C26 46 38 46 42 43" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
