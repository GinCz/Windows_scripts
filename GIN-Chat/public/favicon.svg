<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Cyan glow for sharp ninja eyes -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00e5ff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Ninja Silhouette on pure transparent background -->
  <g id="black-ninja">
    <!-- Outer Hood Silhouette -->
    <path d="M50 6 C28 6 15 20 15 42 C15 62 25 78 33 87 L35 95 C35 96.5 36.5 97.5 38 97.5 L62 97.5 C63.5 97.5 65 96.5 65 95 L67 87 C75 78 85 62 85 42 C85 20 72 6 50 6 Z" fill="#0b0c0e"/>
    
    <!-- Hood Inner Volume Tone -->
    <path d="M50 9 C31 9 19 22 19 42 C19 59 28 74 35 84 L37 93 L63 93 L65 84 C72 74 81 59 81 42 C81 22 69 9 50 9 Z" fill="#14151a"/>

    <!-- Headband / Forehead Wrap Fabric -->
    <path d="M21 28 C30 24 70 24 79 28 C81 34 81 40 80 44 C68 39 32 39 20 44 C19 40 19 34 21 28 Z" fill="#20222a"/>
    <path d="M22 30 C32 27 68 27 78 30 L78 35 C68 31 32 31 22 35 Z" fill="#2d303b"/>

    <!-- Eye Slot Opening (Dark Shadow Slot) -->
    <path d="M24 43 C33 39 46 42 50 43 C54 42 67 39 76 43 C78 48 77 55 74 58 C65 54 55 56 50 56 C45 56 35 54 26 58 C23 55 22 48 24 43 Z" fill="#050607"/>

    <!-- Lower Mask Fabric (Overlapping bottom half of face) -->
    <path d="M25 57 C34 53 45 55 50 55 C55 55 66 53 75 57 C78 66 72 80 65 87 L35 87 C28 80 22 66 25 57 Z" fill="#111216"/>
    
    <!-- Mask Cloth Folds -->
    <path d="M27 64 C36 68 64 68 73 64" stroke="#1f2128" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M32 73 C40 77 60 77 68 73" stroke="#1f2128" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M37 81 C44 84 56 84 63 81" stroke="#191a20" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Left Eye (Determined, Focused Ninja Eye) -->
    <path d="M28 49 C32 45.5 41 45.5 45 50 C41 52.5 33 52.5 28 49 Z" fill="#ffffff"/>
    <circle cx="37.5" cy="49" r="3" fill="#000000"/>
    <circle cx="37.5" cy="49" r="1.5" fill="#00e5ff" filter="url(#eyeGlow)"/>
    <circle cx="38.5" cy="48" r="0.8" fill="#ffffff"/>

    <!-- Right Eye (Determined, Focused Ninja Eye) -->
    <path d="M72 49 C68 45.5 59 45.5 55 50 C59 52.5 67 52.5 72 49 Z" fill="#ffffff"/>
    <circle cx="62.5" cy="49" r="3" fill="#000000"/>
    <circle cx="62.5" cy="49" r="1.5" fill="#00e5ff" filter="url(#eyeGlow)"/>
    <circle cx="61.5" cy="48" r="0.8" fill="#ffffff"/>

    <!-- Piercing Eyebrow Folds (Gives the sharp ninja stare) -->
    <path d="M27 46.5 C33 43.5 42 44.5 46 48.5" stroke="#07080a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M73 46.5 C67 43.5 58 44.5 54 48.5" stroke="#07080a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
