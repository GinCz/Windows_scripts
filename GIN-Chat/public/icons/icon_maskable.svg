<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="50%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2333"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="innerPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243047"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Full Background Canvas -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Centered Safe-Zone Scaled Shield (Scale 0.76 around center) -->
  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <!-- Outer Quantum Shield Body -->
    <polygon points="256,58 430,126 430,298 256,436 82,298 82,126" 
             fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>

    <!-- Inner Cyber Armor Plating -->
    <polygon points="256,96 392,148 392,280 256,386 120,280 120,148" 
             fill="url(#innerPlate)" stroke="url(#blueGlow)" stroke-width="9" stroke-linejoin="round"/>

    <!-- Stealth Facet Accent Lines -->
    <line x1="256" y1="96" x2="256" y2="190" stroke="url(#blueGlow)" stroke-width="5" stroke-linecap="round"/>
    <line x1="120" y1="148" x2="204" y2="212" stroke="url(#blueGlow)" stroke-width="5" stroke-linecap="round"/>
    <line x1="392" y1="148" x2="308" y2="212" stroke="url(#blueGlow)" stroke-width="5" stroke-linecap="round"/>

    <!-- Speech Bubble Dynamic Tail Accents -->
    <path d="M190,380 L134,448 L198,424" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="175,385 146,430 184,416" fill="url(#blueGlow)"/>

    <!-- Quantum Core Keyhole -->
    <circle cx="256" cy="226" r="36" fill="#FFFFFF"/>
    <polygon points="238,236 274,236 284,304 228,304" fill="#FFFFFF"/>
    <circle cx="256" cy="226" r="14" fill="#00f2fe"/>
  </g>
</svg>
