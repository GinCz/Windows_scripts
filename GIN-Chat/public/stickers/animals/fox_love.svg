        <ellipse cx="72" cy="145" rx="10" ry="12" fill="#212529"/>
        <ellipse cx="128" cy="145" rx="10" ry="12" fill="#212529"/>
        <!-- Happy squint eyes -->
        <path d="M 68 88 Q 78 80 88 88" stroke="#212529" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M 112 88 Q 122 80 132 88" stroke="#212529" stroke-width="5" stroke-linecap="round" fill="none"/>
