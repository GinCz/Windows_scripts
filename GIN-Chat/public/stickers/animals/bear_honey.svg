      <stop offset="100%" stop-color="#E03131"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69DB7C"/>
      <stop offset="100%" stop-color="#2F9E44"/>
    </linearGradient>
  </defs>
  
      <g filter="url(#shadow)">
        <circle cx="45" cy="55" r="22" fill="#864E2E"/>
        <circle cx="155" cy="55" r="22" fill="#864E2E"/>
        <ellipse cx="100" cy="105" rx="65" ry="56" fill="#864E2E"/>
        <!-- Honey Pot -->
        <path d="M 70 130 Q 60 175 100 175 Q 140 175 130 130 Z" fill="#F59F00"/>
        <ellipse cx="100" cy="130" rx="30" ry="8" fill="#FFE066"/>
        <text x="100" y="160" font-family="sans-serif" font-weight="900" font-size="14" fill="#864E2E" text-anchor="middle">МЁД</text>
      </g>
    
</svg>