<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59F00"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA94D"/>
      <stop offset="100%" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9ECEF"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8787"/>
      <stop offset="100%" stop-color="#E64980"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DABF7"/>
      <stop offset="100%" stop-color="#1971C2"/>
    </linearGradient>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#364FC7"/>
      <stop offset="100%" stop-color="#182A88"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FF922B"/>
      <stop offset="100%" stop-color="#E03131"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69DB7C"/>
      <stop offset="100%" stop-color="#2F9E44"/>
    </linearGradient>
  </defs>
  
      <g filter="url(#shadow)">
        <!-- Glowing Galaxy Brain -->
        <ellipse cx="100" cy="95" rx="60" ry="50" fill="url(#pinkGrad)"/>
        <path d="M 60 95 C 60 70 80 60 100 60 C 120 60 140 70 140 95 C 140 125 120 140 100 140 C 80 140 60 125 60 95 Z" stroke="#FFF" stroke-width="4" fill="none"/>
        <path d="M 80 75 Q 100 95 85 115" stroke="#FFF" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 120 75 Q 100 95 115 115" stroke="#FFF" stroke-width="4" stroke-linecap="round" fill="none"/>
        <!-- Electric aura -->
        <path d="M 35 55 L 45 70 L 30 85" stroke="#FFE066" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M 165 55 L 155 70 L 170 85" stroke="#FFE066" stroke-width="5" stroke-linecap="round" fill="none"/>
      </g>
    
</svg>