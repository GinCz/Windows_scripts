      <stop offset="100%" stop-color="#E03131"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69DB7C"/>
      <stop offset="100%" stop-color="#2F9E44"/>
    </linearGradient>
  </defs>
  
      <g filter="url(#shadow)">
        <!-- 3 Tier Cake -->
        <rect x="50" y="105" width="100" height="35" rx="8" fill="#F06595"/>
        <rect x="65" y="75" width="70" height="30" rx="6" fill="#845EF7"/>
        <!-- Candle -->
        <rect x="96" y="52" width="8" height="23" fill="#FFE066"/>
        <ellipse cx="100" cy="45" rx="6" ry="9" fill="#FF922B"/>
        <rect x="10" y="148" width="180" height="42" rx="21" fill="#E03131"/>
        <text x="100" y="174" font-family="sans-serif" font-weight="900" font-size="15" fill="#FFF" text-anchor="middle">С ДНЁМ РОЖДЕНИЯ! 🎂</text>
      </g>
    
</svg>