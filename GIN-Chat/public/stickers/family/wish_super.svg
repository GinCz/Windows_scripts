        <circle cx="100" cy="90" r="55" fill="url(#greenGrad)"/>
        <!-- Hand drawing -->
        <path d="M 95 50 L 95 80 L 80 80 C 70 80 65 90 65 100 L 65 115 C 65 120 70 125 75 125 L 120 125 C 130 125 135 118 135 105 L 130 85 C 130 75 120 75 115 75 L 115 50 C 115 42 105 42 95 50 Z" fill="#FFF"/>
        <rect x="25" y="152" width="150" height="38" rx="19" fill="#2B8A3E"/>
