<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59F00"/>
    </linearGradient>
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA94D"/>
      <stop offset="100%" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9ECEF"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8787"/>
      <stop offset="100%" stop-color="#E64980"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DABF7"/>
      <stop offset="100%" stop-color="#1971C2"/>
    </linearGradient>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#364FC7"/>
      <stop offset="100%" stop-color="#182A88"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FF922B"/>
      <stop offset="100%" stop-color="#E03131"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69DB7C"/>
      <stop offset="100%" stop-color="#2F9E44"/>
    </linearGradient>
  </defs>
  
      <g filter="url(#shadow)">
        <polygon points="50,65 30,15 85,45" fill="#E8590C"/>
        <polygon points="150,65 170,15 115,45" fill="#E8590C"/>
        <ellipse cx="100" cy="90" rx="65" ry="55" fill="url(#catGrad)"/>
        <!-- Eyes squinting joy -->
        <path d="M 68 85 Q 78 75 88 85" stroke="#212529" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M 112 85 Q 122 75 132 85" stroke="#212529" stroke-width="5" stroke-linecap="round" fill="none"/>
        <!-- Big Coffee Cup -->
        <path d="M 65 125 L 72 175 C 72 185 128 185 128 175 L 135 125 Z" fill="#845EF7"/>
        <path d="M 132 135 C 150 135 150 165 130 165" stroke="#845EF7" stroke-width="6" fill="none"/>
        <!-- Steam -->
        <path d="M 90 115 Q 85 105 95 95" stroke="#CED4DA" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M 105 115 Q 115 105 105 95" stroke="#CED4DA" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- Cat paws holding cup -->
        <ellipse cx="68" cy="145" rx="10" ry="10" fill="#FFA94D"/>
        <ellipse cx="132" cy="145" rx="10" ry="10" fill="#FFA94D"/>
      </g>
    
</svg>