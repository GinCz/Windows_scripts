<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTARIX s.r.o. — Мониторинг и контроль компьютеров</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #243248;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-red: #f87171;
            --accent-purple: #c084fc;
            --accent-orange: #fb923c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); padding: 24px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #0284c7, #38bdf8); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: white; }
        .logo-title { font-size: 20px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }
        .logo-sub { font-size: 13px; color: var(--text-muted); }
        .badge-bar { display: flex; gap: 10px; align-items: center; }
        .badge { background: var(--bg-card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 13px; color: var(--text-muted); }
        .badge strong { color: var(--accent-blue); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--bg-card); padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
        .btn { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-outline:hover { background: var(--border); color: var(--text-main); }

        /* Accordion Level 1 (Computers) */
        .pc-list { display: flex; flex-direction: column; gap: 14px; }
        .pc-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color 0.2s; }
        .pc-card:hover { border-color: #475569; }
        .pc-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; background: var(--bg-card); transition: background 0.2s; }
        .pc-header:hover { background: var(--bg-card-hover); }
        .pc-title-box { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .dot-online { background: var(--accent-green); box-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
        .dot-idle { background: var(--accent-yellow); box-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
        .dot-offline { background: #64748b; }
        .pc-name { font-size: 17px; font-weight: 600; color: var(--text-main); }
        .pc-user { font-size: 13px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; }
        .edit-name-btn { background: none; border: none; cursor: pointer; color: #64748b; font-size: 13px; padding: 2px 4px; border-radius: 4px; }
        .edit-name-btn:hover { color: var(--accent-blue); background: rgba(56, 189, 248, 0.1); }
        .pc-current-app { font-size: 13px; color: var(--accent-blue); background: rgba(56, 189, 248, 0.1); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.2); max-width: 450px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chevron { transition: transform 0.3s; color: var(--text-muted); font-size: 18px; }
        .pc-card.open .chevron { transform: rotate(180deg); }

        .pc-body { display: none; padding: 20px; border-top: 1px solid var(--border); background: #131d31; }
        .pc-card.open .pc-body { display: block; }

        /* Date Controls */
        .date-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .date-input { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        .date-pill { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .date-pill.active { background: #0284c7; color: white; border-color: #0284c7; }

        /* KPI Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
        .kpi-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .kpi-val { font-size: 22px; font-weight: 700; }
        .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* Accordion Level 2 (Programs) */
        .section-title { font-size: 15px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .app-list { display: flex; flex-direction: column; gap: 10px; }
        .app-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .app-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .app-header:hover { background: var(--bg-card-hover); }
        .app-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .app-icon { width: 28px; height: 28px; border-radius: 6px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; }
        .app-name { font-size: 15px; font-weight: 600; color: var(--text-main); }
        .app-time { font-size: 14px; font-weight: 600; margin-left: auto; margin-right: 20px; }
        .progress-bar-bg { width: 120px; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 4px; }

        /* Pages / Windows details sub-list */
        .app-details { display: none; padding: 12px 16px 12px 56px; border-top: 1px solid var(--border); background: #162032; font-size: 13px; }
        .app-item.open .app-details { display: block; }
        .page-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .page-row:last-child { border-bottom: none; }
        .page-title { color: #cbd5e1; flex: 1; padding-right: 14px; word-break: break-all; }
        .page-time { color: var(--text-muted); font-family: monospace; white-space: nowrap; }

        /* Color classes */
        .c-green { color: var(--accent-green); }
        .c-yellow { color: var(--accent-yellow); }
        .c-blue { color: var(--accent-blue); }
        .c-red { color: var(--accent-red); }
        .c-purple { color: var(--accent-purple); }
        .c-orange { color: var(--accent-orange); }
        .bg-green { background: var(--accent-green); }
        .bg-yellow { background: var(--accent-yellow); }
        .bg-blue { background: var(--accent-blue); }
        .bg-purple { background: var(--accent-purple); }
        .bg-orange { background: var(--accent-orange); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-box">
            <div class="logo-icon">U</div>
            <div>
                <div class="logo-title">ULTARIX s.r.o. — Мониторинг активности компьютеров</div>
                <div class="logo-sub">Сервер: ULPS1 (C:\UTIL\UltarixMonitor) | Сеть: \\ulps1\UTIL\UltarixMonitor | Windows 10 (32-bit x86)</div>
            </div>
        </div>
        <div class="badge-bar">
            <div class="badge">Глубина архива: <strong>60 дней</strong></div>
            <div class="badge">Нагрузка на сервер: <strong style="color:var(--accent-green);">0% CPU (Пассивное хранилище)</strong></div>
        </div>
    </div>

    <div class="toolbar">
        <div>
            <span style="font-size: 14px; color: var(--text-muted); margin-right: 8px;">Компьютеры в сети:</span>
            <strong id="totalComputers">Загрузка ПК...</strong>
        </div>
        <div style="display:flex; gap:10px;">
            <input type="file" id="filePicker" webkitdirectory directory multiple style="display:none;" onchange="loadFromFolder(event)">
            <button class="btn btn-outline" onclick="document.getElementById('filePicker').click()">📁 Загрузить папку logs</button>
            <button class="btn" onclick="checkAllComputersLive(true)">🔄 Обновить статус</button>
        </div>
    </div>

    <div class="pc-list" id="pcContainer">
        <!-- Dynamically rendered -->
    </div>

    <script>
        // Track open state for each computer so user's manual expand/collapse is never overwritten
        const pcOpenState = {
            "ULTARIX-07": true,
            "U-09": false,
            "PC-09": false,
            "PC-02": false
        };

        // Saved custom names for employees in localStorage
        const customNames = JSON.parse(localStorage.getItem("ultarix_custom_names") || "{}");

        // Canonical mapping of office computers
        const defaultProfiles = {
            "ULTARIX-07": { name: "Галина", role: "Бухгалтерия 07", icon: "💼" },
            "Ulta_007":   { name: "Галина", role: "Бухгалтерия 07", icon: "💼" },
            "U-09":       { name: "Татьяна / Любовь", role: "Бухгалтерия / Склад (Ёжик)", icon: "📦" },
            "PC-09":      { name: "Татьяна / Любовь", role: "Бухгалтерия / Склад (Ёжик)", icon: "📦" },
            "ULTARIX-09": { name: "Любовь", role: "Бухгалтерия 09", icon: "📦" },
            "PC-02":      { name: "Ульяна", role: "Главный бухгалтер / Директор", icon: "👑" },
            "Ulka-02":    { name: "Ульяна", role: "Главный бухгалтер / Директор", icon: "👑" },
            "ULTARIX-03": { name: "Лилия", role: "Бухгалтерия 03", icon: "📊" },
            "ULTARIX-04": { name: "Оксана", role: "Бухгалтерия 04", icon: "📑" },
            "ULTARIX-05": { name: "Анна", role: "Бухгалтерия 05", icon: "🖨️" },
            "ULTARIX-06": { name: "Бухгалтер 06", role: "Бухгалтерия 06", icon: "📂" },
            "ULTARIX-08": { name: "Светлана", role: "Бухгалтерия 08", icon: "📈" },
            "ULTARIX-010":{ name: "Наталья", role: "Бухгалтерия 10", icon: "🗂️" },
            "ULPS1":      { name: "Сервер", role: "Главный сервер ULPS1", icon: "🖥️" }
        };

        // Primary store data
        const storeData = {
            "ULTARIX-07": {
                defaultName: "Галина",
                defaultRole: "Бухгалтерия 07",
                status: "OFFLINE",
                currentApp: "Ожидание первого отклика от агента...",
                idleSecNow: 0,
                dates: {
                    "2026-11-19": {
                        totalMonitoredSec: 0,
                        activeSec: 0,
                        idleSec: 0,
                        apps: []
                    }
                }
            },
            "U-09": {
                defaultName: "Татьяна / Любовь",
                defaultRole: "Бухгалтерия / Склад (Ёжик)",
                status: "ACTIVE",
                currentApp: "stereo.exe — STEREO (Ježek software) [Deník]",
                idleSecNow: 5,
                dates: {
                    "2026-11-19": {
                        totalMonitoredSec: 29400,
                        activeSec: 23700,
                        idleSec: 5700,
                        apps: [
                            {
                                name: "stereo.exe (STEREO — Ježek software)",
                                icon: "🦔",
                                color: "orange",
                                durationSec: 12600,
                                pages: [
                                    { title: "STEREO - Účetní deník - Zápis dokladů 2026", durationSec: 5400 },
                                    { title: "STEREO - Fakturace - Kniha vydaných faktur", durationSec: 4200 },
                                    { title: "STEREO - Skladová evidence - Příjemky a výdejky", durationSec: 3000 }
                                ]
                            },
                            {
                                name: "ekonom.exe (Ekonom.win)",
                                icon: "E",
                                color: "blue",
                                durationSec: 4800,
                                pages: [
                                    { title: "Ekonom - Faktury přijaté - Schvalování", durationSec: 2800 },
                                    { title: "Ekonom - Příkazy k úhradě - Bankovní export", durationSec: 2000 }
                                ]
                            },
                            {
                                name: "chrome.exe (Google Chrome)",
                                icon: "C",
                                color: "purple",
                                durationSec: 4200,
                                pages: [
                                    { title: "Facebook — Личная лента / Сообщения", durationSec: 2400 },
                                    { title: "YouTube — Просмотр видео / Музыка", durationSec: 1200 },
                                    { title: "Portál MOJE daně (DIS+) — Ověření", durationSec: 600 }
                                ]
                            },
                            {
                                name: "excel.exe (Microsoft Excel)",
                                icon: "X",
                                color: "green",
                                durationSec: 2100,
                                pages: [
                                    { title: "Kalkulace_Cen_2026.xlsx — Tabulka", durationSec: 2100 }
                                ]
                            },
                            {
                                name: "IDLE_PAUSE (Паузы и перерывы / AFK)",
                                icon: "⏸",
                                color: "yellow",
                                durationSec: 5700,
                                pages: [
                                    { title: "Пауза 11:20 - 11:45 (Отошел от ПК)", durationSec: 1500 },
                                    { title: "Пауза 13:00 - 13:45 (Обеденный перерыв)", durationSec: 2700 },
                                    { title: "Пауза 15:30 - 15:55 (Бездействие клавиатуры/мыши)", durationSec: 1500 }
                                ]
                            }
                        ]
                    }
                }
            },
            "PC-02": {
                defaultName: "Ульяна",
                defaultRole: "Главный бухгалтер / Директор",
                status: "ACTIVE",
                currentApp: "chrome.exe — Дашборд контроля Ultarix",
                idleSecNow: 0,
                dates: {
                    "2026-11-19": {
                        totalMonitoredSec: 28800,
                        activeSec: 25200,
                        idleSec: 3600,
                        apps: [
                            {
                                name: "stereo.exe (STEREO — Ježek software)",
                                icon: "🦔",
                                color: "orange",
                                durationSec: 10800,
                                pages: [
                                    { title: "STEREO - Finanční výkazy a Rozvaha", durationSec: 6000 },
                                    { title: "STEREO - Kontrola DPH a podkladů", durationSec: 4800 }
                                ]
                            },
                            {
                                name: "ekonom.exe (Ekonom.win)",
                                icon: "E",
                                color: "blue",
                                durationSec: 9000,
                                pages: [
                                    { title: "Účetní deník — Celkový přehled", durationSec: 5400 },
                                    { title: "Příkazy k úhradě — Odeslání do banky", durationSec: 3600 }
                                ]
                            },
                            {
                                name: "IDLE_PAUSE (Паузы)",
                                icon: "⏸",
                                color: "yellow",
                                durationSec: 3600,
                                pages: [
                                    { title: "Обед 12:30 - 13:30", durationSec: 3600 }
                                ]
                            }
                        ]
                    }
                }
            }
        };

        function formatTime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            if (h > 0) return `${h} ч ${m} мин`;
            return `${m} мин`;
        }

        function editEmployeeName(pcKey, event) {
            event.stopPropagation();
            const current = customNames[pcKey] || (storeData[pcKey] ? `${storeData[pcKey].defaultName} (${storeData[pcKey].defaultRole})` : "");
            const newName = prompt(`Введите имя сотрудника и должность для ${pcKey}:`, current);
            if (newName !== null) {
                customNames[pcKey] = newName.trim();
                localStorage.setItem("ultarix_custom_names", JSON.stringify(customNames));
                updateCardHeader(pcKey);
            }
        }

        function getDisplayName(pcKey) {
            if (customNames[pcKey]) return customNames[pcKey];
            if (storeData[pcKey]) return `${storeData[pcKey].defaultName} (${storeData[pcKey].defaultRole})`;
            const prof = defaultProfiles[pcKey];
            if (prof) return `${prof.name} (${prof.role})`;
            return pcKey;
        }

        function togglePcCard(pcName, cardEl) {
            const isCurrentlyOpen = cardEl.classList.contains("open");
            if (isCurrentlyOpen) {
                cardEl.classList.remove("open");
                pcOpenState[pcName] = false;
            } else {
                cardEl.classList.add("open");
                pcOpenState[pcName] = true;
            }
        }

        function renderDashboard() {
            const container = document.getElementById("pcContainer");
            container.innerHTML = "";

            let activeCount = 0;
            const entries = Object.entries(storeData);

            for (const [pcName, pcInfo] of entries) {
                if (pcInfo.status === "ACTIVE") activeCount++;

                const card = document.createElement("div");
                card.className = "pc-card";
                card.id = `card-${pcName}`;

                if (pcOpenState[pcName] === true) {
                    card.classList.add("open");
                }

                const dotClass = pcInfo.status === "ACTIVE" ? "dot-online" : (pcInfo.status === "IDLE" ? "dot-idle" : "dot-offline");
                const statusText = pcInfo.status === "ACTIVE" ? "В сети (Работает)" : (pcInfo.status === "IDLE" ? `Пауза ${pcInfo.idleSecNow} сек` : "Офлайн");

                const selectedDate = "2026-11-19";
                const dayData = (pcInfo.dates && pcInfo.dates[selectedDate]) || { totalMonitoredSec: 0, activeSec: 0, idleSec: 0, apps: [] };
                const pauseMinutes = Math.floor(dayData.idleSec / 60);

                card.innerHTML = `
                    <div class="pc-header" onclick="togglePcCard('${pcName}', this.parentElement)">
                        <div class="pc-title-box">
                            <span class="status-dot ${dotClass}" id="dot-${pcName}" title="${statusText}"></span>
                            <span class="pc-name">${pcName}</span>
                            <span class="pc-user" id="user-${pcName}">
                                <span>— ${getDisplayName(pcName)}</span>
                                <button class="edit-name-btn" title="Переименовать сотрудника" onclick="editEmployeeName('${pcName}', event)">✏️</button>
                            </span>
                            <span class="pc-current-app" id="app-${pcName}">Сейчас: ${pcInfo.currentApp}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap: 16px;">
                            <span style="font-size:13px; color:var(--text-muted);">Пауза сегодня: <strong class="c-yellow" id="pause-${pcName}">${pauseMinutes} мин</strong></span>
                            <span class="chevron">▼</span>
                        </div>
                    </div>

                    <div class="pc-body">
                        <div class="date-bar">
                            <span style="font-size:13px; color:var(--text-muted);">Выбор дня:</span>
                            <input type="date" class="date-input" value="${selectedDate}" max="2026-11-19">
                            <span class="date-pill active">Сегодня</span>
                            <span class="date-pill">Вчера</span>
                            <span class="date-pill">7 дней</span>
                            <span class="date-pill">30 дней</span>
                            <span class="date-pill">60 дней</span>
                        </div>

                        <div class="kpi-grid">
                            <div class="kpi-card">
                                <div class="kpi-label">Всего за компьютером</div>
                                <div class="kpi-val c-blue" id="kpi-tot-${pcName}">${formatTime(dayData.totalMonitoredSec)}</div>
                                <div class="kpi-sub">Зафиксированное время за день</div>
                            </div>
                            <div class="kpi-card">
                                <div class="kpi-label">Чистое рабочее время</div>
                                <div class="kpi-val c-green" id="kpi-act-${pcName}">${formatTime(dayData.activeSec)}</div>
                                <div class="kpi-sub" id="kpi-act-sub-${pcName}">${Math.round((dayData.activeSec / Math.max(dayData.totalMonitoredSec, 1)) * 100)}% от общего дня</div>
                            </div>
                            <div class="kpi-card" style="border-color: rgba(250, 204, 21, 0.4);">
                                <div class="kpi-label">Всего пауз / бездействия</div>
                                <div class="kpi-val c-yellow" id="kpi-idl-${pcName}">${pauseMinutes} минут</div>
                                <div class="kpi-sub" id="kpi-idl-sub-${pcName}">${formatTime(dayData.idleSec)} (${Math.round((dayData.idleSec / Math.max(dayData.totalMonitoredSec, 1)) * 100)}%)</div>
                            </div>
                        </div>

                        <div class="section-title">Программы и открытые окна / сайты (нажмите для раскрытия деталей):</div>
                        <div class="app-list" id="apps-${pcName}">
                            ${dayData.apps.length === 0 ? '<div style="color:var(--text-muted); padding:10px 0;">Ожидание сбора активности...</div>' :
                            dayData.apps.map(app => {
                                const appPct = Math.round((app.durationSec / Math.max(dayData.totalMonitoredSec, 1)) * 100);
                                return `
                                    <div class="app-item">
                                        <div class="app-header" onclick="this.parentElement.classList.toggle('open')">
                                            <div class="app-left">
                                                <div class="app-icon">${app.icon}</div>
                                                <div class="app-name">${app.name}</div>
                                            </div>
                                            <div class="app-time c-${app.color}">${formatTime(app.durationSec)} (${appPct}%)</div>
                                            <div class="progress-bar-bg">
                                                <div class="progress-bar-fill bg-${app.color}" style="width: ${appPct}%;"></div>
                                            </div>
                                            <div class="chevron" style="margin-left:14px; font-size:14px;">▼</div>
                                        </div>
                                        <div class="app-details">
                                            ${app.pages.map(page => `
                                                <div class="page-row">
                                                    <div class="page-title">${page.title}</div>
                                                    <div class="page-time">${formatTime(page.durationSec)}</div>
                                                </div>
                                            `).join("")}
                                        </div>
                                    </div>
                                `;
                            }).join("")}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            }

            document.getElementById("totalComputers").textContent = `${activeCount} активных / ${entries.length} в системе`;
        }

        function updateCardHeader(pcName) {
            const userEl = document.getElementById(`user-${pcName}`);
            if (userEl) {
                userEl.innerHTML = `
                    <span>— ${getDisplayName(pcName)}</span>
                    <button class="edit-name-btn" title="Переименовать сотрудника" onclick="editEmployeeName('${pcName}', event)">✏️</button>
                `;
            }
        }

        // Parse CSV activity log
        function parseActivityCsv(csvText) {
            const lines = csvText.trim().split("\n");
            if (lines.length <= 1) return null;
            const appMap = {};
            let totalSec = 0;
            let idleSec = 0;

            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split(",");
                if (parts.length < 8) continue;
                const dur = parseInt(parts[2]) || 0;
                const proc = parts[5].trim();
                const title = parts[6].replace(/^"|"$/g, "").trim();
                const state = parts[7].trim();

                totalSec += dur;
                if (state === "IDLE") idleSec += dur;

                const appKey = state === "IDLE" ? "IDLE_PAUSE (Паузы)" : proc;
                if (!appMap[appKey]) {
                    let icon = "💻";
                    let color = "blue";
                    if (appKey.includes("stereo")) { icon = "🦔"; color = "orange"; }
                    else if (appKey.includes("ekonom")) { icon = "E"; color = "blue"; }
                    else if (appKey.includes("chrome") || appKey.includes("brave")) { icon = "C"; color = "purple"; }
                    else if (appKey.includes("excel")) { icon = "X"; color = "green"; }
                    else if (appKey.includes("IDLE")) { icon = "⏸"; color = "yellow"; }

                    appMap[appKey] = {
                        name: appKey,
                        icon: icon,
                        color: color,
                        durationSec: 0,
                        pages: {}
                    };
                }
                appMap[appKey].durationSec += dur;
                appMap[appKey].pages[title] = (appMap[appKey].pages[title] || 0) + dur;
            }

            const apps = Object.values(appMap).map(a => ({
                name: a.name,
                icon: a.icon,
                color: a.color,
                durationSec: a.durationSec,
                pages: Object.entries(a.pages).map(([t, d]) => ({ title: t, durationSec: d }))
            }));

            return {
                totalMonitoredSec: totalSec,
                activeSec: Math.max(0, totalSec - idleSec),
                idleSec: idleSec,
                apps: apps
            };
        }

        // Live check across all possible computer names
        const candidatePcs = [
            "ULTARIX-07", "Ulta_007", "PC-07",
            "U-09", "PC-09", "ULTARIX-09",
            "PC-02", "Ulka-02", "ULTARIX-02",
            "ULTARIX-03", "ULTARIX-04", "ULTARIX-05", "ULTARIX-06", "ULTARIX-08", "ULTARIX-010", "ULPS1"
        ];

        async function checkAllComputersLive(forceRerender = false) {
            let newlyDiscovered = false;

            // Load employees.json config first
            try {
                const confRes = await fetch("employees.json?_=" + Date.now());
                if (confRes.ok) {
                    const empConf = await confRes.json();
                    for (const [k, v] of Object.entries(empConf)) {
                        defaultProfiles[k] = v;
                        if (!candidatePcs.includes(k)) candidatePcs.push(k);
                        if (!customNames[k] && v.name) {
                            customNames[k] = `${v.name} (${v.role || ""})`;
                        }
                    }
                }
            } catch (e) {}

            // Load dynamically registered hosts from active_hosts.txt
            try {
                const hostsRes = await fetch("logs/active_hosts.txt?_=" + Date.now());
                if (hostsRes.ok) {
                    const text = await hostsRes.text();
                    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
                    for (const h of lines) {
                        if (!candidatePcs.includes(h)) candidatePcs.push(h);
                    }
                }
            } catch (e) {}

            const dateStr = new Date().toISOString().slice(0, 10);

            for (const pc of candidatePcs) {
                try {
                    const res = await fetch(`logs/${pc}/current_status.json?_=` + Date.now());
                    if (res.ok) {
                        const data = await res.json();
                        if (!storeData[pc]) {
                            const prof = defaultProfiles[pc] || { name: pc, role: "Рабочая станция", icon: "💻" };
                            storeData[pc] = {
                                defaultName: prof.name,
                                defaultRole: prof.role,
                                status: data.state || "ACTIVE",
                                currentApp: `${data.process} — ${data.window}`,
                                idleSecNow: data.idle_sec || 0,
                                dates: {}
                            };
                            newlyDiscovered = true;
                        } else {
                            storeData[pc].status = data.state || "ACTIVE";
                            storeData[pc].currentApp = `${data.process} — ${data.window}`;
                            storeData[pc].idleSecNow = data.idle_sec || 0;
                        }

                        // Try loading today's CSV activity
                        try {
                            const csvRes = await fetch(`logs/${pc}/activity_${dateStr}.csv?_=` + Date.now());
                            if (csvRes.ok) {
                                const csvText = await csvRes.text();
                                const parsed = parseActivityCsv(csvText);
                                if (parsed) {
                                    storeData[pc].dates[dateStr] = parsed;
                                }
                            }
                        } catch (e) {}

                        // Update in-place elements if rendered
                        const appEl = document.getElementById(`app-${pc}`);
                        const dotEl = document.getElementById(`dot-${pc}`);
                        if (appEl) appEl.textContent = `Сейчас: ${storeData[pc].currentApp}`;
                        if (dotEl) {
                            dotEl.className = "status-dot " + (data.state === "ACTIVE" ? "dot-online" : "dot-idle");
                            dotEl.title = data.state === "ACTIVE" ? "В сети (Работает)" : `Пауза ${data.idle_sec || 0} сек`;
                        }
                    }
                } catch (e) {}
            }

            if (newlyDiscovered || forceRerender) {
                renderDashboard();
            }
        }

        function loadFromFolder(event) {
            const files = event.target.files;
            alert(`Загружено ${files.length} файлов из папки logs. Статус обновлен!`);
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderDashboard();
            checkAllComputersLive(true);
            setInterval(() => checkAllComputersLive(false), 5000);
        });
    </script>
</body>
